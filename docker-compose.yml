services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: beneficio-postgres
    environment:
      POSTGRES_DB: beneficio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beneficio_db"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - beneficio-network

  # Backend Application Service
  backend:
    build:
      context: .
      dockerfile: backend-module/Dockerfile
    container_name: beneficio-backend
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beneficio_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: 20
      LOGGING_LEVEL_COM_EXAMPLE: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/swagger-ui.html"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - beneficio-network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local

networks:
  beneficio-network:
    driver: bridge